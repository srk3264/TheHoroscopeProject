<script src="https://unpkg.com/lucide@latest"></script>

    .view { display: none; width: 100%; max-width: 393px; }
    .active { display: block; }

    .auth-container { padding: 40px 22px; text-align: center; z-index: 1; position: relative; }
    .auth-container input, .auth-container select { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: none; font-size: 16px; }
    .auth-container button { width: 100%; padding: 12px; border-radius: 999px; border: none; background: #1E87E8; color: white; font-weight: 600; font-size: 16px; cursor: pointer; }

    /* Figma Layout Styles */
    .figma-root { width: 100%; min-height: 100vh; position: relative; background: linear-gradient(180deg, #C7CED6 0%, #043963 50%, #020202 100%); overflow-x: hidden; z-index: 1; }
    .content-wrapper { padding: 52px 16px 100px 16px; display: flex; flex-direction: column; gap: 22px; }
    .horizontal-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .card-item { min-width: 200px; width: 200px; padding: 16px; background: rgba(255, 255, 255, 0.10); border-radius: 12px; display: flex; flex-direction: column; }
    .action-card { padding: 24px 22px; border-radius: 12px; display: flex; flex-direction: column; gap: 32px; color: white; }
    .bg-blue { background: linear-gradient(180deg, #1E87E8 0%, #1EE1E8 100%); }
    .bg-orange { background: linear-gradient(180deg, #F26522 0%, #D63D00 100%); }
    .pill-btn { padding: 12px; border-radius: 999px; border: 1px solid white; text-align: center; font-family: 'Inter', sans-serif; font-size: 13.3px; font-weight: 500; cursor: pointer; }
    .chat-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 44px); max-width: 349px; padding: 16px 22px; background: #1C1C1C; border-radius: 100px; display: flex; justify-content: space-between; align-items: center; color: rgba(255, 255, 255, 0.60); font-size: 14px; }

<button onclick="openChatView()" style="background: none; border: none; cursor: pointer; padding: 4px;" title="Chat">

      <!-- Bottom Query Bar -->
      <div class="chat-bar" style="display: flex; align-items: center; gap: 8px;">
  <input type="text" id="chat-input" placeholder="What’s happening today?" onkeydown="if(event.key === 'Enter') handleSendMessage()" style="flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 14px;" />

    <i data-lucide="send" style="width: 18px; height: 18px; color: rgba(255, 255, 255, 0.7);"></i>
  </button>
</div>

    </div>
  </div>

  <!-- 4. DEDICATED CHAT VIEW -->
<div id="view-chat" class="view">
  <div class="figma-root" style="display: flex; flex-direction: column; height: 100vh; padding: 20px 16px;">
    <!-- Chat Header -->
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <button onclick="showView('view-dashboard')" style="background: none; border: none; cursor: pointer; color: white; padding: 4px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>

    <!-- Dedicated Screen Input Bar -->

      <input type="text" id="chat-page-input" placeholder="Ask anything..." onkeydown="if(event.key === 'Enter') handleSendMessage('chat-page-input')" style="flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 14px;" />
      <button type="button" onclick="handleSendMessage('chat-page-input')" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center;">
        <i data-lucide="send" style="width: 18px; height: 18px; color: rgba(255, 255, 255, 0.7);"></i>

</div>

<!-- 5. SETTINGS VIEW -->
  <div id="view-settings" class="view">
    <div class="auth-container">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <button onclick="showView('view-dashboard')" style="background: none; border: none; cursor: pointer; padding: 4px; color: white;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>

      </div>

      <form id="settings-form" onsubmit="handleUpdateSigns(event)">
        <label style="display: block; text-align: left; margin-top: 12px;">Your Sign</label>
        <select id="settings-user-sign" required>
          <option value="aries">Aries ♈</option>
          <option value="taurus">Taurus ♉</option>
          <option value="gemini">Gemini ♊</option>
          <option value="cancer">Cancer ♋</option>
          <option value="leo">Leo ♌</option>
          <option value="virgo">Virgo ♍</option>
          <option value="libra">Libra ♎</option>
          <option value="scorpio">Scorpio ♏</option>
          <option value="sagittarius">Sagittarius ♐</option>
          <option value="capricorn">Capricorn ♑</option>
          <option value="aquarius">Aquarius ♒</option>
          <option value="pisces">Pisces ♓</option>
        </select>

        <label style="display: block; text-align: left; margin-top: 12px;">Partner's Sign</label>
        <select id="settings-partner-sign" required>
          <option value="aries">Aries ♈</option>
          <option value="taurus">Taurus ♉</option>
          <option value="gemini">Gemini ♊</option>
          <option value="cancer">Cancer ♋</option>
          <option value="leo">Leo ♌</option>
          <option value="virgo">Virgo ♍</option>
          <option value="libra">Libra ♎</option>
          <option value="scorpio">Scorpio ♏</option>
          <option value="sagittarius">Sagittarius ♐</option>
          <option value="capricorn">Capricorn ♑</option>
          <option value="aquarius">Aquarius ♒</option>
          <option value="pisces">Pisces ♓</option>

        <button type="submit" style="margin-top: 24px;">Save Changes</button>
      </form>

      <hr style="margin: 32px 0 24px 0; border: none; border-top: 1px solid rgba(255,255,255,0.2);" />

      <button onclick="handleLogout()" style="background-color: #ef4444; color: white;">
        Log Out
      </button>
    </div>
  </div>

  <script src="app.js"></script>

<script>
(function() {
  const canvas = document.getElementById('cosmic-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let width, height;
  let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
  const particles = [];
  const PARTICLE_COUNT = 100;

  const LAYERS = [
    { count: Math.floor(PARTICLE_COUNT * 0.5), minSize: 0.5, maxSize: 1.2, speed: 0.02, alpha: 0.4 },
    { count: Math.floor(PARTICLE_COUNT * 0.35), minSize: 1.2, maxSize: 2.2, speed: 0.05, alpha: 0.7 },
    { count: Math.floor(PARTICLE_COUNT * 0.15), minSize: 3.0, maxSize: 4.5, speed: 0.09, alpha: 0.3 }
  ];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  function initParticles() {
    particles.length = 0;
    const colors = ['#ffffff', '#a78bfa', '#1ee1e8', '#f472b6'];

    LAYERS.forEach(layer => {
      for (let i = 0; i < layer.count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * (layer.maxSize - layer.minSize) + layer.minSize,
          color: colors[Math.floor(Math.random() * colors.length)],
          layerSpeed: layer.speed,
          baseAlpha: layer.alpha,
          pulseSpeed: 0.01 + Math.random() * 0.02,
          pulseVal: Math.random() * Math.PI
        });
      }
    });
  }

  function animate() {
    mouse.x += (mouse.targetX - mouse.x) * 0.05;
    mouse.y += (mouse.targetY - mouse.y) * 0.05;

    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => {
      let drawX = p.x + (mouse.x * p.layerSpeed);
      let drawY = p.y + (mouse.y * p.layerSpeed);

      if (drawX < 0) drawX += width;
      if (drawX > width) drawX -= width;
      if (drawY < 0) drawY += height;
      if (drawY > height) drawY -= height;

      p.pulseVal += p.pulseSpeed;
      const currentAlpha = p.baseAlpha + Math.sin(p.pulseVal) * 0.2;

      ctx.beginPath();
      ctx.arc(drawX, drawY, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, Math.min(1, currentAlpha));

      if (p.size > 2) {
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  window.addEventListener('mousemove', (e) => {
    mouse.targetX = (e.clientX - width / 2);
    mouse.targetY = (e.clientY - height / 2);
  });

  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma !== null && e.beta !== null) {
      mouse.targetX = e.gamma * 8;
      mouse.targetY = e.beta * 8;
    }
  });

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  resize();
  initParticles();
  animate();
})();
</script>

</body>
</html>
