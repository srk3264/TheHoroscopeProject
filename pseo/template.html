<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{TITLE}}</title>

  <meta
    name="description"
    content="{{META_DESCRIPTION}}"
  >

  <link
    rel="canonical"
    href="{{CANONICAL_URL}}"
  >

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- Structured Data -->
  <script type="application/ld+json">
  {{STRUCTURED_DATA}}
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #111;
      background: #FCFCFC;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .site-header {
      width: 100%;
      padding: 24px 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FCFCFC;
    }

    .logo {
      text-decoration: none;
      font-family: 'Averia Serif Libre', serif;
      font-size: 28px;
      font-weight: 700;
    }

    .site-nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .site-nav a {
      text-decoration: none;
      font-size: 15px;
    }

    .breadcrumb-wrap {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 16px 0;
    }

    .breadcrumbs {
      font-size: 14px;
      color: #666;
    }

    .breadcrumbs a {
      color: #666;
      text-decoration: none;
    }

    .breadcrumbs span {
      margin: 0 8px;
    }

    main {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    .hero {
      max-width: 820px;
      margin-bottom: 48px;
    }

    h1 {
      margin: 0 0 20px;
      font-family: 'Averia Serif Libre', serif;
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 400;
      line-height: 1.05;
    }

    .intro {
      font-size: 20px;
      line-height: 1.6;
      color: #444;
    }

    .quick-nav {
      margin: 40px 0;
      padding: 24px;
      border-radius: 16px;
      background: #f3f3f3;
    }

    .quick-nav h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .quick-nav ul {
      margin: 0;
      padding-left: 20px;
    }

    .quick-nav a {
      text-decoration: none;
    }

    .content-section {
      margin: 64px 0;
    }

    h2 {
      margin: 0 0 20px;
      font-family: 'Averia Serif Libre', serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      line-height: 1.15;
    }

    h3 {
      margin: 32px 0 12px;
      font-size: 22px;
    }

    .section-intro {
      max-width: 760px;
      color: #444;
    }

    .idea-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 28px;
    }

    .idea-card {
      padding: 24px;
      background: white;
      border: 1px solid #e8e8e8;
      border-radius: 18px;
    }

    .idea-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .idea-card h3 {
      margin-top: 0;
    }

    .idea-card p {
      margin-bottom: 16px;
      color: #444;
    }

    .idea-card a {
      font-weight: 700;
    }

    .how-to {
      padding: 32px;
      background: #f7f7f7;
      border-radius: 20px;
    }

    .faq {
      border-top: 1px solid #ddd;
    }

    .faq-item {
      padding: 24px 0;
      border-bottom: 1px solid #ddd;
    }

    .faq-item h3 {
      margin: 0 0 8px;
    }

    .cta {
      margin-top: 72px;
      padding: 48px 32px;
      text-align: center;
      border-radius: 24px;
      background: #111;
      color: white;
    }

    .cta h2 {
      color: white;
    }

    .cta p {
      max-width: 600px;
      margin: 0 auto 24px;
    }

    .cta-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: #FF1A00;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .site-footer {
      padding: 40px 6vw;
      border-top: 1px solid #e5e5e5;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .site-header {
        padding: 20px;
      }

      .site-nav {
        gap: 12px;
      }

      .site-nav a {
        font-size: 14px;
      }

      main {
        width: min(100% - 32px, 1100px);
        padding-top: 24px;
      }

      .breadcrumb-wrap {
        width: calc(100% - 32px);
      }

      .idea-grid {
        grid-template-columns: 1fr;
      }

      .content-section {
        margin: 48px 0;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="logo" href="{{SITE_URL}}">Spark</a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{SITE_URL}}">Home</a>
      <a href="{{APP_URL}}">Try Spark</a>
    </nav>
  </header>

  <div class="breadcrumb-wrap">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{SITE_URL}}">Home</a>
      <span>→</span>
      <a href="{{DATE_IDEAS_URL}}">Date Ideas</a>
      <span>→</span>
      <span>{{PAGE_TITLE}}</span>
    </nav>
  </div>

  <main>

    <section class="hero">
      <h1>{{H1}}</h1>

      <p class="intro">
        {{INTRO}}
      </p>
    </section>

    <nav class="quick-nav" aria-label="Page contents">
      <h2>On This Page</h2>
      {{QUICK_NAV}}
    </nav>

    {{SECTIONS}}

    <section class="content-section how-to">
      <h2>{{HOW_TO_TITLE}}</h2>
      {{HOW_TO_CONTENT}}
    </section>

    <section class="content-section faq">
      <h2>Frequently Asked Questions</h2>
      {{FAQS}}
    </section>

    <section class="cta">
      <h2>{{CTA_TITLE}}</h2>

      <p>
        {{CTA_TEXT}}
      </p>

      <a class="cta-button" href="{{APP_URL}}">
        {{CTA_BUTTON}}
      </a>
    </section>

  </main>

  <footer class="site-footer">
    <p>
      © {{YEAR}} Spark. Couples deserve more fun together.
    </p>
  </footer>

</body>
</html>
